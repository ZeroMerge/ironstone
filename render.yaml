services:
  # Backend Web Service (Node + Puppeteer Headless PDF Engine via Docker)
  - type: web
    name: ironstone-backend
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: PORT
        value: 4100
      - key: FRONTEND_BASE_URL
        sync: false # Set to your Vercel / custom domain URL, e.g. https://yourdomain.com
      - key: EXPORT_TOKEN_SECRET
        sync: false # Paste your random secret string here
      - key: RESEND_API_KEY
        sync: false # Paste your Resend API key here
      - key: RESEND_FROM
        value: Ironstone <onboarding@resend.dev>
      - key: PINTEREST_ACCESS_TOKEN
        sync: false # Optional, leave blank if you don't have one yet
