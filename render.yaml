services:
  # Backend Web Service Only (Node + Puppeteer Headless PDF Engine)
  - type: web
    name: ironstone-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node src/index.js
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: FRONTEND_BASE_URL
        sync: false # Set to your Vercel / custom domain URL, e.g. https://yourdomain.com
      - key: EXPORT_TOKEN_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Ironstone <onboarding@resend.dev>
